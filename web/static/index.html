<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUS — CCTV Command Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body class="command-hub-body">

  <!-- Grade Principal de CFTV e HUD Tático (Layout Clean 100% Fullscreen) -->
  <main class="cctv-grid" id="cctv-grid">

    <!-- Câmera 1 (Superior Esquerdo) -->
    <section class="camera-card" id="card-cam-1" data-camera-id="cam_frente">
      <div class="video-container">
        <video id="video-cam_frente" autoplay playsinline webkit-playsinline muted preload="auto" disablePictureInPicture disableRemotePlayback></video>
        <div class="fps-badge fps-zero" id="fps-cam_frente"><span class="fps-dot"></span><span class="fps-val">0 FPS</span></div>
        <div class="video-overlay" id="overlay-cam_frente">
          <div class="spinner"></div>
          <span class="overlay-text" id="status-text-cam_frente">Conectando...</span>
        </div>
      </div>
    </section>

    <!-- Câmera 2 (Superior Direito) -->
    <section class="camera-card" id="card-cam-2" data-camera-id="cam_garagem">
      <div class="video-container">
        <video id="video-cam_garagem" autoplay playsinline webkit-playsinline muted preload="auto" disablePictureInPicture disableRemotePlayback></video>
        <div class="fps-badge fps-zero" id="fps-cam_garagem"><span class="fps-dot"></span><span class="fps-val">0 FPS</span></div>
        <div class="video-overlay" id="overlay-cam_garagem">
          <div class="spinner"></div>
          <span class="overlay-text" id="status-text-cam_garagem">Conectando...</span>
        </div>
      </div>
    </section>

    <!-- Câmera 3 (Inferior Esquerdo) -->
    <section class="camera-card" id="card-cam-3" data-camera-id="cam_fundos">
      <div class="video-container">
        <video id="video-cam_fundos" autoplay playsinline webkit-playsinline muted preload="auto" disablePictureInPicture disableRemotePlayback></video>
        <div class="fps-badge fps-zero" id="fps-cam_fundos"><span class="fps-dot"></span><span class="fps-val">0 FPS</span></div>
        <div class="video-overlay" id="overlay-cam_fundos">
          <div class="spinner"></div>
          <span class="overlay-text" id="status-text-cam_fundos">Conectando...</span>
        </div>
      </div>
    </section>

    <!-- Quadrante 4: HUD Tático de Comando Clean -->
    <section class="hud-card" id="card-hud">
      <div class="hud-widgets-container">
        <!-- Widget 1: Relógio Modular Apple Watch Ultra com 60 Ticks SVG -->
        <div class="cctv-clock-widget" id="cctv-clock-widget"></div>

        <!-- Widget 2: Usina Fotovoltaica & Clima Estilo Tesla -->
        <div class="cctv-solar-widget" id="cctv-solar-widget"></div>
      </div>
    </section>

  </main>

  <!-- Módulos Vanilla JavaScript -->
  <script src="/js/clock.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/telemetry.js"></script>
</body>
</html>
