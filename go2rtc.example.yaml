# ==============================================================================
# go2rtc — Gateway WebRTC & Fallback de Transcodificação H.264
# ==============================================================================
# Arquivo de configuração de exemplo para go2rtc.
# Copie para 'go2rtc.yaml' e insira as credenciais reais das suas câmeras.

api:
  listen: ":1984"

webrtc:
  listen: ":8555"

ffmpeg:
  bin: "ffmpeg"

streams:
  # Câmera 01 — Portão
  cam_frente:
    - rtsp://usuario:senha@192.168.68.53:554/stream1
    - ffmpeg:cam_frente#video=h264
  cam-0:
    - rtsp://usuario:senha@192.168.68.53:554/stream1
    - ffmpeg:cam-0#video=h264
  cam_frente_sub:
    - rtsp://usuario:senha@192.168.68.53:554/stream2
    - ffmpeg:cam_frente_sub#video=h264
  cam-0-sub:
    - rtsp://usuario:senha@192.168.68.53:554/stream2
    - ffmpeg:cam-0-sub#video=h264

  # Câmera 02 — Garagem
  cam_garagem:
    - rtsp://usuario:senha@192.168.68.57:554/stream1
    - ffmpeg:cam_garagem#video=h264
  cam-1:
    - rtsp://usuario:senha@192.168.68.57:554/stream1
    - ffmpeg:cam-1#video=h264
  cam_garagem_sub:
    - rtsp://usuario:senha@192.168.68.57:554/stream2
    - ffmpeg:cam_garagem_sub#video=h264
  cam-1-sub:
    - rtsp://usuario:senha@192.168.68.57:554/stream2
    - ffmpeg:cam-1-sub#video=h264

  # Câmera 03 — Fundos / Perímetro
  cam_fundos:
    - rtsp://usuario:senha@192.168.68.56:554/stream1
    - ffmpeg:cam_fundos#video=h264
  cam-2:
    - rtsp://usuario:senha@192.168.68.56:554/stream1
    - ffmpeg:cam-2#video=h264
  cam_fundos_sub:
    - rtsp://usuario:senha@192.168.68.56:554/stream2
    - ffmpeg:cam_fundos_sub#video=h264
  cam-2-sub:
    - rtsp://usuario:senha@192.168.68.56:554/stream2
    - ffmpeg:cam-2-sub#video=h264
