# ==============================================================================
# ARGUS — Configuração Declarativa do Hub CFTV
# ==============================================================================

server:
  port: 8080
  bind_address: "0.0.0.0"

# Lista de Câmeras Monitoradas no Painel
cameras:
  - id: "cam_frente"
    name: "Câmera 01 — Portão"
    # Mainstream em alta resolução (exibido quando a câmera é maximizada em tela cheia)
    rtsp_url: "${CAM_1_RTSP}"
    # Substream leve de baixa resolução (exibido na grade 2x2 para economizar CPU do Raspberry Pi)
    substream_url: "${CAM_1_SUBSTREAM}"

  - id: "cam_garagem"
    name: "Câmera 02 — Garagem"
    rtsp_url: "${CAM_2_RTSP}"
    substream_url: "${CAM_2_SUBSTREAM}"

  - id: "cam_fundos"
    name: "Câmera 03 — Área do Fundo"
    rtsp_url: "${CAM_3_RTSP}"
    substream_url: "${CAM_3_SUBSTREAM}"

# Usina Solar Fotovoltaica (Huawei FusionSolar)
solar:
  poll_interval_minutes: 5

# Clima e Previsão Meteorológica (Open-Meteo)
weather:
  enabled: true
  latitude: -10.8847
  longitude: -61.9514
  city_name: "Ji-Paraná, RO"
  poll_interval_minutes: 30
